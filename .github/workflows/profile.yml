name: profile

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *" # 03:17 JST
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Stats card
        run: |
          pip install --quiet fonttools
          python scripts/build.py --user "$GITHUB_REPOSITORY_OWNER" --out dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff8fc0&color_dots=#e9ecf8,#cfe0ff,#a8c6ff,#86a6f5,#6a84e0
            dist/snake-dark.svg?color_snake=#ff9fcf&color_dots=#232647,#2f3f78,#4560a8,#6688d8,#9ab8ff

      # The output branch holds a single commit, so daily updates add no history to main.
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Update profile images"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows after 60 days without repo activity
      # (the old snake stopped in 2023 this way); re-enabling resets that timer.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/profile.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
